<div class="center-container">
  <h1>{{ "login" | translate }}</h1>

  <form [formGroup]="loginForm" class="center-container">
    <mat-form-field>
      <mat-label>{{ "username" | translate }}:</mat-label>
      <input type="text" matInput formControlName="username">
      @if (loginForm.get('username')?.errors) {
        <mat-error>{{ "username required" | translate }}</mat-error>
      }
    </mat-form-field>

    <mat-form-field>
      <mat-label>{{ "password" | translate }}:</mat-label>
      <input type="password" matInput formControlName="password">
      @if (loginForm.get('password')?.errors) {
        <mat-error>{{ "password required" | translate }}</mat-error>
      }
    </mat-form-field>

    <button mat-flat-button color="primary" class="login-button" (keyup.enter)="login()" (click)="login()" [disabled]="loginForm.invalid">{{ "login" | translate }}</button>
  </form>
</div>
